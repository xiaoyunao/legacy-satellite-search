scope: One original physical background, one native PS1 skycell. Acquire immutable science/variance-or-weight/mask/exposure products and image-specific DR2 references; inspect actual executable usage and FITS headers before native processing. No source truth, injection, discovery search, candidate confirmation, response transport or physical LS-minus-PS1 gain in this acquisition tranche. Pixel units and operator/catalogue equivalence must be established from actual products before physical injection.
