scope: Compare the existing LS-proxy estimator with independent morphology-supported stellar references on held-out objects in one common-coverage control field. Matched LS and COSMOS counterparts share the same holdout key. Source selection probabilities are not system detection probabilities. No physical background transfer, mutual cluster crowding, independent-sky validation, HSC passband identity, or 0706 confirmation is inferred.
