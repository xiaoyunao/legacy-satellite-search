coverage_rule: Finite positive native stack exposure time and no listed fatal/contamination
  pixel bits in each of g,r,i, intersected with actual LS WCS exposure/mask area.
  Union repeated skycells per band before requiring all three bands. No source density
  or detected-object requirement defines area. This is central-pixel coverage, not
  PSF-weighted selection completeness.
image_documentation: https://outerspace.stsci.edu/spaces/PANSTARRS/pages/298812251/PS1+Image+Cutout+Service
mask_documentation: https://outerspace.stsci.edu/spaces/PANSTARRS/pages/298812335/PS1+Pixel+flags+in+Image+Table+Data
census_mask_role: Preserve the unsuccessful strict census-mask branch separately;
  bit128 excludes most COSMOS reference positions although actual DR2 primary catalogue
  exists. Native-image coverage validates an external reference field, not membership
  in the published census search footprint.
scope: Targeted external single-source response validation. No new discovery area,
  primary CCD background, candidate confirmation or validated transport to the three
  physical backgrounds.
motivation: First native0.6873deg2 reference has2792 gold stars/212 faint-blue stars
  but no supported held-out LS gr0<0.4 response bins. Expand only exposure-defined
  coverage of the same1.6degree reference field, preserving all labels/cuts/holdout
  rules and all first-pass products. This adds no primary physical background or discovery
  area.
