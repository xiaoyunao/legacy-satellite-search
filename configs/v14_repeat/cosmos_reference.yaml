scope: Independent ACS morphology and deep HSC photometry to assess LS proxy purity and PS1 response estimation in one control field. A stellar reference requires ACS_MU_CLASS=2 and lp_type=1; resolved/SED galaxies and ambiguous labels stay separate. The catalogue is near-infrared detection selected; photometry is observed, not MW-corrected, and quoted errors lack correlated-noise correction. No HSC-to-DECam/PS1 identity is assumed. Agreement is not perfect truth, and neither transfer to the three physical backgrounds nor compact-system mutual crowding is validated by this reference alone. This is not new discovery area or a new primary CCD background.
