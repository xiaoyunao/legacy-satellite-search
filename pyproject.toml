[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ls-satsearch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "astropy", "astropy-healpix", "fitsio", "matplotlib", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]
